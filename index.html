<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELLO // 2099</title>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  :root { --bg:#05060f; --neon:#00f0ff; --pink:#ff2bd6; --txt:#cfe9ff; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(255,43,214,.25), transparent 60%),
      linear-gradient(rgba(0,240,255,.07) 1px, transparent 1px) 0 0/100% 40px,
      linear-gradient(90deg, rgba(0,240,255,.07) 1px, transparent 1px) 0 0/40px 100%,
      var(--bg);
    color:var(--txt); font-family:"Courier New", monospace; text-align:center;
  }
  .card {
    padding:3rem 4rem; border:1px solid rgba(0,240,255,.4); border-radius:12px;
    background:rgba(5,6,15,.7); backdrop-filter:blur(6px);
    box-shadow:0 0 30px rgba(0,240,255,.25), inset 0 0 30px rgba(0,240,255,.05);
  }
  .glow {
    margin:0; font-size:clamp(2rem,8vw,5rem); letter-spacing:.2em; color:#fff;
    text-shadow:0 0 8px var(--neon), 0 0 24px var(--neon), 0 0 60px var(--pink);
    animation:flicker 3s infinite;
  }
  .sub { color:var(--neon); letter-spacing:.3em; text-transform:uppercase; font-size:.8rem; }
  button {
    margin-top:1rem; padding:.9rem 2.2rem; cursor:pointer; letter-spacing:.3em; text-transform:uppercase;
    background:transparent; color:var(--neon); border:1px solid var(--neon); border-radius:4px;
    font-family:inherit; transition:.2s; box-shadow:0 0 12px rgba(0,240,255,.4);
  }
  button:hover { background:var(--neon); color:var(--bg); box-shadow:0 0 30px var(--neon); }
  .htmx-request { opacity:.4; }
  @keyframes flicker { 0%,95%,100%{opacity:1} 96%{opacity:.6} 97%{opacity:1} 98%{opacity:.5} }
</style>
</head>
<body>
  <div class="card">
    <div id="out">
      <p class="sub">▮ system idle · awaiting signal</p>
    </div>
    <button hx-get="/hello" hx-target="#out" hx-swap="innerHTML">Initialize</button>
  </div>
</body>
</html>
